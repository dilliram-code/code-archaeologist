[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Eel"
version = "0.19.0"
description = "Little Python library for Electron-like HTML/JS GUI apps with easy Python/JS interop"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Chris Knott" },
    { name = "Python Eel Organisation", email = "python-eel@protonmail.com" },
]
maintainers = [
    { name = "Antigravity Code Archaeologist & Maintainer" }
]
requires-python = ">=3.9"
keywords = ["gui", "html", "javascript", "electron", "desktop-app", "rpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "bottle>=0.12.25,<1.0.0",
    "bottle-websocket>=0.2.9,<1.0.0",
    "gevent>=24.2.1",
    "gevent-websocket>=0.10.1,<1.0.0",
    "greenlet>=3.0.0",
    "pyparsing>=3.1.0,<4.0.0",
    "typing-extensions>=4.8.0",
    "importlib-resources>=5.0.0; python_version < '3.9'",
]

[project.optional-dependencies]
jinja2 = [
    "jinja2>=3.1.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "psutil>=5.9.0",
    "mypy>=1.10.0",
]
all = [
    "jinja2>=3.1.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
eel-pack = "eel.__main__:main"

[project.urls]
Homepage = "https://github.com/python-eel/Eel"
Repository = "https://github.com/python-eel/Eel.git"
Changelog = "https://github.com/python-eel/Eel/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["eel*"]

[tool.setuptools.package-data]
eel = ["eel.js", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
timeout = 30
filterwarnings = [
    "ignore::DeprecationWarning:gevent.*",
    "ignore::DeprecationWarning:bottle.*",
]

[tool.mypy]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "bottle.*",
    "bottle_websocket.*",
    "gevent.*",
    "geventwebsocket.*",
    "pyparsing.*",
    "winreg.*",
    "PyInstaller.*",
    "jinja2.*",
    "pytest.*",
    "selenium.*",
]
ignore_missing_imports = true
